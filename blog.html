  <div class="page">
    <a href="index.html" class="back-link">← Home</a>
    <p id="blog-unread" class="blog-unread" hidden></p>
    <div id="blog-list-view">
      <div class="page-label">// 08</div>
      <h1 class="page-title">Blog</h1>
      <p class="page-intro">Tech stories, news and what I'm learning as I build toward a security career.</p>
      <div class="blog-toolbar">
        <div id="blog-tags" class="blog-tags" role="group" aria-label="Filter by topic"></div>
        <button type="button" id="blog-write-btn" class="btn btn-primary btn-sm" hidden>+ New post</button>
      </div>
      <p id="blog-status" class="form-note" role="status"></p>
      <div id="blog-list" class="blog-list"></div>
    </div>

    <article id="blog-post-view" class="blog-post" hidden>
      <button type="button" id="blog-post-back" class="btn btn-ghost btn-sm">← All posts</button>
      <div id="blog-post-admin" class="blog-post-admin" hidden>
        <button type="button" id="blog-post-edit" class="btn btn-ghost btn-sm">Edit post</button>
      </div>
      <div id="blog-post-content"></div>
      <section id="blog-discussion" class="discussion" hidden aria-labelledby="discussion-title">
        <h2 id="discussion-title" class="discussion-title">Discussion <span id="discussion-count" class="discussion-count"></span></h2>
        <div class="discussion-tools">
          <label class="discussion-sort">Sort
            <select id="discussion-sort" class="field-input">
              <option value="new">Newest</option>
              <option value="top">Most liked</option>
            </select>
          </label>
        </div>
        <div id="discussion-compose"></div>
        <p id="discussion-status" class="form-note" role="status"></p>
        <div id="discussion-list" class="discussion-list"></div>
      </section>
    </article>

    <section id="blog-editor" class="blog-editor" hidden aria-labelledby="blog-editor-title">
      <button type="button" id="blog-editor-back" class="btn btn-ghost btn-sm">← Cancel</button>
      <h2 id="blog-editor-title" class="blog-editor-title">New post</h2>
      <form id="blog-form" novalidate>
        <label class="field-label">Title
          <input type="text" id="blog-title" class="field-input" maxlength="120" required>
        </label>
        <label class="field-label">Short summary (shown on the list)
          <textarea id="blog-excerpt" class="story-input" rows="2" maxlength="240"></textarea>
        </label>
        <label class="field-label">Topics (comma-separated, up to 5)
          <input type="text" id="blog-tags-input" class="field-input" maxlength="140" placeholder="e.g. cybersecurity, networking, news">
        </label>
        <label class="field-label">Cover image (optional)
          <input type="file" id="blog-cover" accept="image/*">
        </label>
        <p id="blog-cover-note" class="form-note" hidden></p>

        <h3 class="blog-editor-sub">Content</h3>
        <div id="blog-blocks" class="blog-blocks"></div>
        <div class="blog-add-row" role="group" aria-label="Add content">
          <button type="button" class="btn btn-ghost btn-sm" data-add="text">+ Paragraph</button>
          <button type="button" class="btn btn-ghost btn-sm" data-add="quote">+ Quote</button>
          <button type="button" class="btn btn-ghost btn-sm" data-add="photo">+ Photo</button>
          <button type="button" class="btn btn-ghost btn-sm" data-add="video">+ Video upload</button>
          <button type="button" class="btn btn-ghost btn-sm" data-add="embed">+ YouTube / Vimeo link</button>
        </div>

        <label class="field-label">Status
          <select id="blog-status-input" class="field-input">
            <option value="draft">Draft (only you can see it)</option>
            <option value="published">Published (public)</option>
          </select>
        </label>
        <p id="blog-form-status" class="form-error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" id="blog-save" class="btn btn-primary btn-sm">Save</button>
          <button type="button" id="blog-delete" class="btn btn-ghost btn-sm btn-danger" hidden>Delete post</button>
        </div>
      </form>
    </section>
  </div>
