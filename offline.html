<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You're offline — Fidel Kenyatta</title>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#060a0f"/>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
           background: #060a0f; color: #c9d1d9; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 1.5rem; }
    .box { max-width: 26rem; }
    .icon { font-size: 3rem; margin-bottom: 0.6rem; }
    h1 { color: #fff; font-size: 1.6rem; margin: 0 0 0.6rem; }
    p { color: #8b949e; line-height: 1.7; margin: 0 0 1.4rem; }
    button { background: #00ff88; color: #04110a; border: 0; border-radius: 8px; padding: 0.7rem 1.4rem;
             font-weight: 700; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>This page needs an internet connection and isn't saved on your phone yet. Check your connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
